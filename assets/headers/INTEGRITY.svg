    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
    .spinr{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .dash{stroke-dasharray:6 10;animation:dash 3s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-64}}
  </style>
</defs>
