  <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="0.5" stop-color="#7DF9FF"/><stop offset="1" stop-color="#B388FF"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#00E5FF" stop-opacity="0"/><stop offset="0.5" stop-color="#00E5FF"/><stop offset="1" stop-color="#B388FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00E5FF" stop-opacity="0.55"/><stop offset="1" stop-color="#B388FF" stop-opacity="0.05"/></linearGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#00E5FF" stop-opacity="0.55"/><stop offset="0.5" stop-color="#B388FF" stop-opacity="0.18"/><stop offset="1" stop-color="#B388FF" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1400" height="140" rx="18"/></clipPath>
  <style>
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(180px)}}
    .pulse{animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
    .spinr{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .dash{stroke-dasharray:6 10;animation:dash 3s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-64}}
  </style>
</defs>
