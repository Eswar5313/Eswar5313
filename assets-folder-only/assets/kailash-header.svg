<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="sky" cx="30%" cy="30%" r="90%">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="0.55" stop-color="#0D0D0D"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#C9CDD6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C9CDD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9A9A9A"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222222"/>
      <stop offset="1" stop-color="#0D0D0D"/>
    </linearGradient>
    <filter id="blur14" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur5" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
    <!-- Shiva figure, standing, drawn once and reused for glow + body -->
    <g id="figure">
      <!-- jata (matted hair) bun and strands -->
      <ellipse cx="330" cy="82" rx="24" ry="22"/>
      <path d="M306,90 C292,120 286,150 296,176 L304,178 C298,150 306,120 316,98 Z"/>
      <path d="M354,90 C368,120 374,150 364,176 L356,178 C362,150 354,120 344,98 Z"/>
      <!-- head + neck -->
      <circle cx="330" cy="120" r="27"/>
      <rect x="321" y="142" width="18" height="18"/>
      <!-- torso -->
      <path d="M286,164 Q330,150 374,164 L364,276 L296,276 Z"/>
      <!-- right arm (holds trishul) -->
      <path d="M368,168 C392,190 404,220 404,252" fill="none" stroke-width="20" stroke-linecap="round"/>
      <circle cx="404" cy="256" r="13"/>
      <!-- left arm raised in abhaya mudra -->
      <path d="M292,168 C270,190 262,214 270,232" fill="none" stroke-width="20" stroke-linecap="round"/>
      <path d="M270,232 C258,210 262,182 274,160" fill="none" stroke-width="18" stroke-linecap="round"/>
      <circle cx="275" cy="150" r="14"/>
      <path d="M263,140 l4,-14 M270,136 l2,-16 M279,136 l0,-16 M287,140 l-2,-14" stroke-width="5" stroke-linecap="round"/>
      <!-- dhoti -->
      <path d="M294,274 L366,274 L380,380 L280,380 Z"/>
      <!-- legs + feet -->
      <rect x="296" y="376" width="26" height="62" rx="6"/>
      <rect x="338" y="376" width="26" height="62" rx="6"/>
      <ellipse cx="304" cy="440" rx="22" ry="7"/>
      <ellipse cx="356" cy="440" rx="22" ry="7"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="1400" height="480" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="110" r="1.2"/>
    <circle cx="210" cy="30" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="60" r="1.4"/>
    <circle cx="560" cy="120" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="35" r="1.7"/>
    <circle cx="760" cy="90" r="1.2"/>
    <circle cx="880" cy="28" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="70" r="1.1"/>
    <circle cx="1080" cy="140" r="1.3"/>
    <circle cx="1200" cy="45" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1320" cy="120" r="1.2"/>
    <circle cx="1370" cy="30" r="1.5"/>
    <circle cx="100" cy="200" r="1"/>
    <circle cx="700" cy="180" r="1"/>
    <circle cx="1150" cy="210" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon (top right) -->
  <circle cx="1260" cy="95" r="120" fill="url(#moonGlow)"/>
  <circle cx="1260" cy="95" r="46" fill="#FFFFFF"/>
  <circle cx="1282" cy="80" r="42" fill="#0D0D0D"/>

  <!-- Kailash peaks -->
  <path d="M0,330 L120,250 L200,300 L290,220 L400,300 L520,240 L640,320 L780,260 L900,330 L1020,270 L1150,330 L1280,280 L1400,330 L1400,480 L0,480 Z" fill="url(#peakFar)"/>
  <path d="M0,370 L90,320 L170,350 L250,300 L340,360 L460,290 L560,380 L700,320 L840,390 L960,340 L1100,400 L1240,350 L1400,400 L1400,480 L0,480 Z" fill="url(#peak)"/>
  <!-- snow caps -->
  <g fill="#C9CDD6" opacity="0.8">
    <path d="M250,300 L236,318 L264,318 Z"/><path d="M460,290 L444,312 L478,312 Z"/><path d="M700,320 L686,338 L716,338 Z"/>
    <path d="M960,340 L946,356 L976,356 Z"/><path d="M1240,350 L1226,366 L1256,366 Z"/><path d="M290,220 L274,240 L308,240 Z" opacity="0.5"/><path d="M520,240 L506,258 L536,258 Z" opacity="0.5"/>
  </g>
  <!-- rock platform -->
  <path d="M200,442 Q330,428 470,442 L490,480 L180,480 Z" fill="#000000"/>
  <path d="M230,446 Q330,436 440,446" fill="none" stroke="#2A2A2A" stroke-width="2"/>

  <!-- aura behind the figure -->
  <circle cx="330" cy="150" r="150" fill="url(#aura)">
    <animate attributeName="r" values="140;158;140" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="120" r="78" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="72;84;72" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.25;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="120" r="94" fill="none" stroke="#C9CDD6" stroke-width="1" opacity="0.35" stroke-dasharray="4 6"/>

  <!-- trishul (behind hand) -->
  <g stroke="#C9CDD6" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="408" y1="60" x2="408" y2="444"/>
    <path d="M408,60 L408,22"/>
    <path d="M380,40 C378,22 386,12 394,20 L394,50 Z" fill="#C9CDD6" stroke-width="2"/>
    <path d="M436,40 C438,22 430,12 422,20 L422,50 Z" fill="#C9CDD6" stroke-width="2"/>
    <path d="M402,24 C402,10 414,10 414,24 L414,54 L402,54 Z" fill="#C9CDD6" stroke-width="2"/>
    <line x1="382" y1="52" x2="434" y2="52" stroke-width="3"/>
  </g>
  <!-- damru tied to the trishul -->
  <g transform="translate(430,108)">
    <path d="M-16,-14 L16,-14 L4,0 L16,14 L-16,14 L-4,0 Z" fill="#3A3A3A" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="0" y1="-14" x2="-18" y2="-40" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="-18" cy="-40" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- figure: gold rim glow then dark body -->
  <use href="#figure" fill="#FFFFFF" stroke="#FFFFFF" filter="url(#blur5)" opacity="0.9"/>
  <use href="#figure" fill="#000000" stroke="#000000"/>

  <!-- crescent on the hair -->
  <g transform="translate(356,70)">
    <circle r="11" fill="#FFFFFF"/>
    <circle cx="6" cy="-4" r="10" fill="#000000"/>
  </g>
  <!-- third eye -->
  <ellipse cx="330" cy="112" rx="3.2" ry="7" fill="#FFFFFF" filter="url(#blur2)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="330" cy="112" rx="1.6" ry="5" fill="#FFFFFF"/>
  <!-- Ganga flowing from the jata -->
  <path d="M312,72 C296,96 300,124 288,150 C280,168 270,182 268,200" fill="none" stroke="#DDDDDD" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="6 4;6 4" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- serpent around the neck -->
  <path d="M300,166 C316,186 344,186 360,166 C368,158 376,158 380,166 C384,174 378,178 372,172" fill="none" stroke="#C9CDD6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="372" cy="172" r="4" fill="#C9CDD6"/>
  <circle cx="373" cy="171" r="1.2" fill="#C9CDD6"/>
  <!-- rudraksha mala -->
  <path d="M304,176 C318,224 342,224 356,176" fill="none" stroke="#3A3A3A" stroke-width="4" stroke-dasharray="1 5" stroke-linecap="round"/>
  <!-- tiger-skin stripes on dhoti -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" fill="none">
    <path d="M300,296 q8,10 0,22"/><path d="M322,304 q8,12 0,26"/><path d="M344,296 q8,10 0,24"/><path d="M362,310 q6,12 0,24"/>
    <path d="M296,346 q8,8 0,18"/><path d="M330,340 q8,10 0,24"/><path d="M360,350 q6,8 0,18"/>
  </g>

  <!-- text panel -->
  <rect x="530" y="100" width="640" height="300" rx="18" fill="#000000" opacity="0.55"/>
  <rect x="530" y="100" width="4" height="300" fill="url(#gold)"/>
  <!-- title block -->
  <text x="560" y="150" font-size="22" letter-spacing="6" fill="#FFFFFF">ॐ नमः शिवाय</text>
  <text x="560" y="222" font-size="60" font-weight="bold" letter-spacing="2" fill="#FFFFFF">ESWAR MAHALINGAM</text>
  <rect x="560" y="240" width="520" height="3" fill="url(#gold)"/>
  <text x="560" y="286" font-size="28" letter-spacing="3" fill="#C9CDD6">CAREER CONTROL TOWER</text>
  <text x="560" y="326" font-size="19" letter-spacing="1.5" fill="#C9CDD6">DATA ANALYTICS  ·  SUPPLY CHAIN  ·  AI</text>
  <text x="560" y="366" font-size="15" fill="#9A9A9A">MBA · CSCMP SCPro · Six Sigma Black Belt · Ghaziabad, NCR</text>
  <!-- trishul mark at far right -->
  <g transform="translate(1310,290)" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <line x1="0" y1="-40" x2="0" y2="70"/>
    <path d="M-22,-10 C-24,-40 -12,-48 -10,-30 L-10,-8"/>
    <path d="M22,-10 C24,-40 12,-48 10,-30 L10,-8"/>
    <path d="M-5,-30 C-5,-52 5,-52 5,-30 L5,-6 L-5,-6 Z"/>
    <line x1="-24" y1="-6" x2="24" y2="-6"/>
  </g>
  <text x="560" y="390" font-size="15" fill="#9A9A9A">Immediate joiner · India · EU (Blue Card track) · Gulf</text>
</svg>
