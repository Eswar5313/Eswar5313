<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07140F"/>
      <stop offset="0.55" stop-color="#0B2A20"/>
      <stop offset="1" stop-color="#114232"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#E9C46A"/>
      <stop offset="1" stop-color="#F4E3B5"/>
    </linearGradient>
    <linearGradient id="em" x1="0" x2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="1280" height="320" rx="20"/></clipPath>
    <style>
      .rise{animation:rise 1.2s ease-out both}
      .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      .breathe{animation:breathe 5s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
      .sweep{animation:sweep 6s linear infinite}
      @keyframes sweep{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <!-- fine grid -->
    <g stroke="#34D399" stroke-opacity="0.06" stroke-width="1">
      <path d="M0 64H1280M0 128H1280M0 192H1280M0 256H1280"/>
      <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
    </g>
    <circle cx="1080" cy="160" r="210" fill="url(#glow)" class="breathe"/>
    <!-- monogram -->
    <g transform="translate(1080,160)">
      <circle r="92" fill="none" stroke="#E9C46A" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle r="76" fill="#0B2A20" stroke="#34D399" stroke-opacity="0.5" stroke-width="1"/>
      <text x="0" y="22" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="2" fill="url(#gold)" font-family="Georgia,'Times New Roman',serif">MJ</text>
      <text x="0" y="52" text-anchor="middle" font-size="11" letter-spacing="4" fill="#A7F3D0">VENTURES</text>
    </g>
    <!-- text block -->
    <text x="72" y="82" font-size="15" font-weight="600" letter-spacing="5" fill="#34D399" class="rise">M.JAYAESWAR VENTURES</text>
    <text x="70" y="150" font-size="58" font-weight="700" fill="#F5F1E8" class="rise d1" font-family="Georgia,'Times New Roman',serif">Eswar Mahalingam</text>
    <rect x="72" y="170" width="120" height="3" rx="1.5" fill="url(#gold)" class="rise d2"/>
    <text x="72" y="210" font-size="24" font-weight="600" fill="#E9C46A" class="rise d2">Founder · M.JayaEswar Ventures</text>
    <text x="72" y="244" font-size="17" fill="#CFE9DD" class="rise d3">Building Europe-facing e-commerce brands with an operator's discipline and a data toolkit</text>
    <g class="rise d4" font-size="13" font-weight="600" fill="#0B2A20">
      <rect x="72" y="266" width="86" height="26" rx="13" fill="#34D399"/><text x="115" y="283" text-anchor="middle">Enjoyvo</text>
      <rect x="166" y="266" width="140" height="26" rx="13" fill="#A7F3D0"/><text x="236" y="283" text-anchor="middle">Enjoyvo Boutique</text>
      <rect x="314" y="266" width="84" height="26" rx="13" fill="#A7F3D0"/><text x="356" y="283" text-anchor="middle">Lookvio</text>
      <rect x="406" y="266" width="84" height="26" rx="13" fill="#A7F3D0"/><text x="448" y="283" text-anchor="middle">Lovprint</text>
      <text x="508" y="284" font-weight="500" fill="#CFE9DD">· selling across Europe in EUR</text>
    </g>
    <rect y="317" width="300" height="3" fill="url(#em)" class="sweep"/>
  </g>
  <rect x="1" y="1" width="1278" height="318" rx="20" fill="none" stroke="#E9C46A" stroke-opacity="0.35"/>
</svg>
